
name: Test Lottery Tracker Access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check page availability
        run: |
          node <<'NODE'
          async function main() {
            const response = await fetch(
              'https://thelotterytracker.com/scratch-offs/ar',
              {
                headers: {
                  'User-Agent': 'ArkansasScratchFinder/1.0'
                },
                signal: AbortSignal.timeout(20000)
              }
            );

            console.log('HTTP status:', response.status);
            console.log(
              'Page reachable:',
              response.ok
            );

            if (!response.ok) {
              throw new Error(
                'Page request failed with HTTP ' +
                response.status
              );
            }
          }

          main().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
